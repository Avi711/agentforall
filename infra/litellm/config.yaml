model_list:
  - model_name: gemini-agentforall
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      # 3.8-flash (GA 2026-09-02) shares 3.7's pricing: intro through 2026-12-31, doubles to
      # 1.5e-6 / 7.5e-6 / 1.5e-7 on 2027-01-01
      input_cost_per_token: 0.75e-6
      output_cost_per_token: 3.75e-6
      cache_read_input_token_cost: 7.5e-8

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  drop_params: true
  request_timeout: 120
  set_verbose: false

general_settings:
  store_model_in_db: true
